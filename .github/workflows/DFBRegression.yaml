name: DFB Regression Tests

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Select Environment to run'
        required: true
        default: 'stage'
        type: choice
        options:
          - pit
          - stage

      report-integration:
          description: 'Select Testmo Project'
          required: true
          default: 'Test Project'
          type: choice
          options:
            - Test Project
            - Mode QA       
  schedule:
    - cron: '00 4 * * *'  #4:00 AM UTC -> 11:00 PM EST

env:
  POSTMARK_API_KEY: ${{ secrets.POSTMARK_API_KEY }}
  TESTMO_TOKEN: ${{ secrets.TESTMO_TOKEN }}
  BTMS_SSO_PASSWORD: ${{ secrets.BTMS_SSO_PASSWORD }}
  GLOBAL_PASSWORD: ${{ secrets.GLOBAL_PASSWORD }}
  DME_PASSWORD: ${{ secrets.DME_PASSWORD }}

  BULK_CHANGE_PASSWORD: ${{ secrets.BULK_CHANGE_PASSWORD }}
  CUSTOMER_PORTAL_PASSWORD: ${{ secrets.CUSTOMER_PORTAL_PASSWORD }}
  LEGACY_CUSTOMER_PORTAL_PASSWORD: ${{ secrets.LEGACY_CUSTOMER_PORTAL_PASSWORD }}
  TNX_PASSWORD: ${{ secrets.TNX_PASSWORD }}
  TNX_REP_PASSWORD: ${{ secrets.TNX_REP_PASSWORD }}
  TRITAN_ADMIN_CUSTOMER_PASSWORD: ${{ secrets.TRITAN_ADMIN_CUSTOMER_PASSWORD }}
  TRITAN_CUSTOMER_PASSWORD: ${{ secrets.TRITAN_CUSTOMER_PASSWORD }}  
   # database connection details for BTMS
  BTMS_DB_PASSWORD: ${{ secrets.BTMS_DB_PASSWORD }}
  BTMS_DB_PORT: ${{ secrets.BTMS_DB_PORT }}
  BTMS_DB_SCHEMA: ${{ secrets.BTMS_DB_SCHEMA }}
  BTMS_DB_USER: ${{ secrets.BTMS_DB_USER }}
  BTMS_SSH_KEY: ${{ secrets.BTMS_SSH_KEY }}
  BTMS_SSH_PORT: ${{ secrets.BTMS_SSH_PORT }}
  BTMS_SSH_USER: ${{ secrets.BTMS_SSH_USER }}

  
jobs:
  tests:
    runs-on: ubuntu-latest
    # Only run on schedule if RUN_BILLING_TOGGLE is true to disable execution make it to false from repo settings
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && vars.RUN_DFB == 'true')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'schedule' && 'master' || github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: lts/*

      - name: Cache Playwright browsers
        uses: actions/cache@v3
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-v1-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-v1-
 
      - name: Install dependencies
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

      - name: Verify Chrome availability
        run: google-chrome --version
 
      - name: Run Playwright tests
        run: npx playwright test --grep "@at_dfb"
        env:
          TEST_MODULE: DFB
          RUN_NAME: AI-DFB
          source: ${{ (github.event_name == 'schedule' && 'Scheduled') || (github.event_name == 'workflow_dispatch' && 'Manual') || 'Local' }}
          EXECUTION_ENV: ${{ github.event_name == 'schedule' && 'stage' || github.event.inputs.environment }}
          REPORT_INTEGRATION: ${{ github.event_name == 'schedule' && 'Mode QA' || github.event.inputs.report-integration }}
          
      - name: Upload Playwright Test Report
        uses: actions/upload-artifact@v4
        if: always()  # Upload report even if tests fail
        with:
          name: playwright-report
          path: src/reporting/playwright-report/
          retention-days: ${{vars.REPORT_RETENTION_DAYS || 15}}